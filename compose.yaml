services:
  storage-init:
    image: alpine:3.22
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - jobs:/data
    restart: "no"

  redis:
    image: redis:8-alpine
    user: "999:1000"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    read_only: true
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports: ["8080:8080"]
    read_only: true
    volumes:
      - jobs:/data
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      CONVERTBOX_MODE: "api"
      CONVERTBOX_STORAGE: "/data"
      CONVERTBOX_REDIS_URL: "redis://redis:6379/0"
      CONVERTBOX_MAX_MB: "25"
      CONVERTBOX_QUEUE_SIZE: "20"
      CONVERTBOX_JOB_TIMEOUT: "45s"
      CONVERTBOX_JOB_TTL: "20m"
      # Set in your shell or a .env file before exposing this beyond
      # localhost; see deploy/Caddyfile and the README's deployment section.
      CONVERTBOX_API_KEY: "${CONVERTBOX_API_KEY:-}"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  worker:
    build: .
    read_only: true
    volumes:
      - jobs:/data
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      CONVERTBOX_MODE: "worker"
      CONVERTBOX_STORAGE: "/data"
      CONVERTBOX_REDIS_URL: "redis://redis:6379/0"
      CONVERTBOX_WORKERS: "2"
      CONVERTBOX_QUEUE_SIZE: "20"
      CONVERTBOX_JOB_TIMEOUT: "45s"
      CONVERTBOX_JOB_TTL: "20m"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Optional TLS-terminating reverse proxy for exposing `api` beyond
  # localhost. Off by default; enable with `docker compose --profile proxy up`.
  # See deploy/Caddyfile for the public-domain vs. internal/LAN setup.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports: ["80:80", "443:443"]
    read_only: true
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=16m
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jobs:
  redis-data:
  caddy-data:
  caddy-config:
