services:
  storage-init:
    image: alpine:3.22
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - jobs:/data
    restart: "no"

  redis:
    image: redis:8-alpine
    user: "999:1000"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    read_only: true
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Only ever needs to be reachable from api/worker/pdf-worker, all on
    # this same egress-denied network--see the `backend` network's own
    # comment below.
    networks: ["backend"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports: ["8080:8080"]
    read_only: true
    volumes:
      - jobs:/data
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      CONVERTBOX_MODE: "api"
      CONVERTBOX_STORAGE: "/data"
      CONVERTBOX_REDIS_URL: "redis://redis:6379/0"
      CONVERTBOX_MAX_MB: "25"
      CONVERTBOX_QUEUE_SIZE: "20"
      CONVERTBOX_JOB_TIMEOUT: "45s"
      CONVERTBOX_JOB_TTL: "20m"
      # Set in your shell or a .env file before exposing this beyond
      # localhost; see deploy/Caddyfile and the README's deployment section.
      CONVERTBOX_API_KEY: "${CONVERTBOX_API_KEY:-}"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    # Stays on the normal `default` network too (unlike worker/pdf-worker),
    # since it has to keep being reachable on its published port--`backend`
    # is only added so it can reach `redis` to enqueue jobs. Publishing a
    # port still works on a multi-homed container; it just doesn't route
    # out over the `internal: true` network specifically. api never runs
    # an external tool against untrusted file content itself (workers do),
    # so it isn't part of the egress-denial goal `backend` exists for.
    networks: ["default", "backend"]

  worker:
    build: .
    read_only: true
    volumes:
      - jobs:/data
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      CONVERTBOX_MODE: "worker"
      CONVERTBOX_STORAGE: "/data"
      CONVERTBOX_REDIS_URL: "redis://redis:6379/0"
      CONVERTBOX_WORKERS: "2"
      CONVERTBOX_QUEUE_SIZE: "20"
      CONVERTBOX_JOB_TIMEOUT: "45s"
      CONVERTBOX_JOB_TTL: "20m"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Egress-denied: `backend` is an `internal: true` network, so this
    # container gets no default gateway at all and can't reach the
    # internet or the rest of the LAN--only redis, its one real network
    # dependency, on that same network. This is the actual blast-radius
    # containment the "PDF worker isolation" section and pdf-worker's own
    # split queue only got partway to on their own: a compromised
    # LibreOffice/ImageMagick/ffmpeg process here (all run against
    # untrusted uploaded content) has nowhere to make an outbound
    # connection to at all, closing off SSRF/exfiltration regardless of
    # what a future bug in any of those tools might otherwise allow.
    networks: ["backend"]

  # Runs PDF->image jobs only, off their own Redis queue, so a hostile PDF
  # that ever finds a bug in poppler's pdftoppm compromises this container
  # instead of the shared `worker` handling every other conversion
  # (Office/ODF/Markdown/HTML->PDF via LibreOffice, images, structured
  # data). Same image as `worker`--pdftoppm is already in it--just a
  # different CONVERTBOX_MODE and a lighter resource envelope, since it
  # never has to run memory-hungry LibreOffice.
  pdf-worker:
    build: .
    read_only: true
    volumes:
      - jobs:/data
    cpus: 1.0
    mem_limit: 384m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      CONVERTBOX_MODE: "pdf-worker"
      CONVERTBOX_STORAGE: "/data"
      CONVERTBOX_REDIS_URL: "redis://redis:6379/0"
      CONVERTBOX_WORKERS: "2"
      CONVERTBOX_QUEUE_SIZE: "20"
      CONVERTBOX_JOB_TIMEOUT: "45s"
      CONVERTBOX_JOB_TTL: "20m"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Egress-denied for the same reason as worker--see its own comment
    # above. pdftoppm is the one running against untrusted uploaded PDFs
    # here.
    networks: ["backend"]

  # Optional TLS-terminating reverse proxy for exposing `api` beyond
  # localhost. Off by default; enable with `docker compose --profile proxy up`.
  # See deploy/Caddyfile for the public-domain vs. internal/LAN setup.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports: ["80:80", "443:443"]
    read_only: true
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=16m
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  # api still gets the automatic `default` network Compose would create
  # anyway (it doesn't declare `networks:` for that reason on any service
  # here except api, which explicitly re-lists it since declaring
  # `networks:` at all opts a service out of the implicit default
  # attachment). `backend` is the actual egress-denial mechanism: an
  # `internal: true` network gets no default gateway and can't expose
  # ports, so redis/worker/pdf-worker--everything that either holds queue
  # data or runs an external tool against untrusted uploaded content--has
  # no route to the internet or the rest of the LAN at all, only to each
  # other. Verified against Docker's own compose-file network reference
  # rather than assumed.
  backend:
    internal: true

volumes:
  jobs:
  redis-data:
  caddy-data:
  caddy-config:
